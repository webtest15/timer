.logo.spin{transform:rotate(360deg)}
@media (min-width:900px){.logobtn{width:72px;height:53px}}
@media (prefers-reduced-motion:reduce){.logo{transition:none}}
.ibtn{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
h2{font-size:14px;color:var(--sub);margin:16px 0 8px;font-weight:700}
.strip{position:relative;display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:4px 2px 8px}
.arrow{align-self:center;color:var(--sub);flex:none}
.blk{flex:1 0 140px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:120px;display:flex;flex-direction:column;gap:2px}
.blk .n{font-size:13px;color:var(--sub)}
.blk .nm{font-weight:700;font-size:20px}
.blk .pl,.blk .act{font-size:14px;font-variant-numeric:tabular-nums}
.blk .act{font-weight:700}
.actions{margin-top:12px;display:grid;gap:10px}
.actions .big,.actions .next{margin-top:0}
.stp{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.grid2 .row2{margin-bottom:0}
@media (min-width:900px){h2{font-size:17px}.step b{font-size:28px}.blk{flex-basis:170px;padding:16px 18px;min-height:150px}.blk .nm{font-size:26px}.blk .pl,.blk .act{font-size:18px}.blk .st{font-size:15px}.panel{padding:30px 16px}.panel .lb{font-size:22px}.big{min-height:100px;font-size:34px}.next{min-height:100px;font-size:24px;margin-top:0}.actions{grid-template-columns:2fr 1fr}.arrow{font-size:22px}}
.blk .st{font-size:12px;margin-top:auto;color:var(--sub)}
.blk.doing{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.blk.doing .st{color:var(--ac);font-weight:700}
.blk.doing.late{border-color:var(--ng)}
.blk.doing.late .st{color:var(--ng)}
.blk.done{background:var(--okbg);border-color:transparent}
.blk.done .st{color:var(--ok);font-weight:700}
.step{display:flex;justify-content:space-between;align-items:baseline}
.step b{font-size:20px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.panel .lb{font-size:14px;color:var(--sub)}
.panel .v{font-size:clamp(40px,10vw,150px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px;letter-spacing:.01em}
.panel.red{background:var(--ngbg);border-color:var(--ng)}
.panel.red .v,.panel.red .lb{color:var(--ng)}
.panel.green .v{color:var(--ok)}
.alertbar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ng);color:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:700}
.alertbar[hidden]{display:none}
.alertbar button{background:#fff;color:var(--ng);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.big{display:block;width:100%;margin-top:12px;min-height:72px;border-radius:14px;border:0;background:var(--ac);color:var(--acink);font-size:24px;font-weight:700}
.big.paused{background:var(--ok);color:#fff}
.big:disabled{opacity:.5}
.next{display:block;width:100%;margin-top:10px;min-height:52px;border-radius:12px;border:2px solid var(--ac);background:transparent;font-size:17px;font-weight:700;color:var(--ac)}
.hint{color:var(--sub);font-size:14px;text-align:center;margin-top:10px}
.ov{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));z-index:10}
.ov .in{max-width:1000px;margin:0 auto}
.ov h3{margin:0;font-size:18px;flex:1}
.menu button.row{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:8px;font-size:17px}
.row2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 .no{width:34px;font-weight:700;color:var(--sub)}
input[type=text],input[type=number],select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
input[type=text]{flex:1;min-width:120px}
input[type=number]{width:84px;text-align:center}
.sm{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.sm.del{color:var(--ng)}
.add{width:100%;min-height:52px;border:2px dashed var(--line);background:transparent;border-radius:12px;font-size:16px;margin-top:4px}
.lab{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.lab input[type=range]{flex:1;max-width:260px}
.lab input[type=checkbox]{width:26px;height:26px}
.opt{font-size:13px;color:var(--sub);margin:4px 2px 10px}
.danger{margin-top:18px;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ng);color:var(--ng);background:transparent}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY='junbate_v1';
var uid=function(){return 'b'+Math.random().toString(36).slice(2,8)};
var defBlocks=function(){var a=[];for(var i=1;i<=4;i++)a.push({id:uid(),name:i+'ブロック',min:10,st:'idle',inD:0,outD:0,act:null});return a};
var S={blocks:defBlocks(),cur:-1,base:0,runStart:null,alerted:false,finished:false,set:{on:true,vol:0.7,type:'pipi',repeat:true}};
var view='main',muted=false,lastBeep=0,ctx=null;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.blocks&&p.blocks.length)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function now(){return Date.now()}
function elapsed(){return S.base+(S.runStart?now()-S.runStart:0)}
/* 残り時間 = 標準時間 − 引継ぎ遅れ − 経過。0以下になった分が遅れ時間 */
function calc(){
  if(S.cur<0)return null;
  var b=S.blocks[S.cur];
  var rem=b.min*60000-b.inD*1000-elapsed();
  return rem>0?{rem:rem,del:b.inD*1000}:{rem:0,del:-rem};
}
/* 次工程へ引き継ぐ遅れ：残り時間が残っていれば遅れは回復済み(0)、超過していれば超過分 */
function outDelay(){var c=calc();return c.rem>0?0:c.del}
var dlg=null;
function ask(msg,cb){dlg={msg:msg,cb:cb};render()}
function dlgView(){return '<div class="ov" style="z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center"><div style="background:var(--card);border-radius:14px;padding:20px;max-width:360px;width:90%"><p style="margin:0 0 16px;font-size:17px">'+esc(dlg.msg)+'</p><div style="display:flex;gap:8px">'+(dlg.cb?'<button class="next" style="margin:0" data-act="dlgno">キャンセル</button>':'')+'<button class="big" style="margin:0;min-height:52px;font-size:17px" data-act="dlgok">OK</button></div></div></div>'}
function mmss(ms,up){var s=up?Math.ceil(ms/1000):Math.floor(ms/1000);if(s<0)s=0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

/* ---------- 音 ---------- */
var PAT={pipi:[[880,0,.12,'square'],[880,.2,.12,'square'],[880,.4,.12,'square']],buzz:[[220,0,.7,'sawtooth']],chime:[[660,0,.35,'sine'],[880,.35,.5,'sine']],bell:[[1046,0,.9,'triangle'],[1568,0,.9,'triangle']]};
var TYPES={pipi:'ピピピ',buzz:'ブザー',chime:'チャイム',bell:'ベル'};
function beep(){
  if(!S.set.on)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    var t0=ctx.currentTime;
    (PAT[S.set.type]||PAT.pipi).forEach(function(n){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type=n[3];o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(Math.max(.001,S.set.vol),t0+n[1]+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(ctx.destination);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.05);
    });
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }catch(e){}
}

/* ---------- 工程操作 ---------- */
function resetAll(){S.cur=-1;S.base=0;S.runStart=null;S.alerted=false;S.finished=false;S.blocks.forEach(function(b){b.st='idle';b.inD=0;b.outD=0;b.act=null});muted=false;save()}
function startBlock(i,force){
  var carry=0,c=calc();
  if(S.finished){return}
  if(S.cur>=0&&i===S.cur)return;
  if(S.cur>=0&&i<S.cur){
    if(!force){ask((i+1)+'ブロックからやり直しますか？',function(){startBlock(i,true)});return}
    carry=S.blocks[i].inD||0;
    for(var k=i+1;k<S.blocks.length;k++){S.blocks[k].st='idle';S.blocks[k].inD=0;S.blocks[k].outD=0;S.blocks[k].act=null}
  }else if(S.cur>=0){
    carry=Math.round(outDelay()/1000);S.blocks[S.cur].act=elapsed();
    S.blocks[S.cur].outD=carry;S.blocks[S.cur].st='done';
    for(var j=S.cur+1;j<i;j++){S.blocks[j].st='done';S.blocks[j].inD=carry;S.blocks[j].outD=carry;S.blocks[j].act=null}
  }
  var b=S.blocks[i];b.inD=carry;b.act=null;b.st='doing';
  S.cur=i;S.base=0;S.runStart=now();S.alerted=false;muted=false;
  if(ctx&&ctx.state==='suspended')ctx.resume();
  save();render();
}
function finish(){
  var c=calc();var b=S.blocks[S.cur];
  b.outD=Math.round(outDelay()/1000);b.act=elapsed();b.st='done';
  S.finished=true;S.runStart=null;S.alerted=false;save();render();
}
function togglePause(){
  if(S.cur<0||S.finished)return;
  if(S.runStart){S.base+=now()-S.runStart;S.runStart=null}else{S.runStart=now()}
  save();render();
}

/* ---------- 描画 ---------- */
function stLabel(b,i){
  if(b.st==='done')return '完了';
  if(b.st==='doing'){var c=calc();return c&&c.rem===0?'作業中・遅れ':'作業中'}
  return '未開始';
}
function mainView(){
  var h='<header><button class="logobtn" data-act="menu" aria-label="メニューを開く"><span class="logo"></span></button><h1>順建てタイマー</h1></header>';
  h+='<h2>工程</h2><div class="strip">';
  S.blocks.forEach(function(b,i){
    var c=i===S.cur&&!S.finished?calc():null;
    var cls='blk '+(b.st==='doing'?'doing':b.st)+(c&&c.rem===0?' late':'');
    var act=b.st==='done'&&b.act!=null?mmss(b.act,false):(b.st==='doing'?mmss(elapsed(),false):'--:--');
    if(i>0)h+='<span class="arrow">→</span>';
    h+='<button class="'+cls+'" data-act="go" data-i="'+i+'"><span class="nm">'+(i+1)+'ブロック</span><span class="pl">予定 '+b.min+'分</span><span class="act">実績 '+act+'</span><span class="st">'+stLabel(b,i)+(b.st==='done'&&b.outD>0?'（遅れ '+mmss(b.outD*1000,false)+'）':'')+'</span></button>';
  });
  h+='</div>';
  var cur=S.cur>=0?S.blocks[S.cur]:null;
  h+='<h2>ステップ</h2><div class="step"><b>'+(S.finished?'全工程が完了しました':cur?(S.cur+1)+'ブロック':'未開始')+'</b></div>';
  h+='<div class="pair" style="margin-top:8px"><div class="panel" id="remBox"><div class="lb">残り時間</div><div class="v" id="rem">--:--</div></div><div class="panel" id="delBox"><div class="lb">遅れ時間</div><div class="v" id="del">正常</div></div></div>';
  h+='<div class="alertbar" id="alertbar" hidden><span>⚠ 予定時間を超過しました</span><button data-act="mute">音を止める</button></div>';
  if(S.finished){
    h+='<button class="big" data-act="reset">最初からやり直す</button>';
  }else if(S.cur<0){
    h+='<button class="big" disabled>上のブロックをタップして開始</button>';
  }else{
    h+='<div class="actions"><button class="big'+(S.runStart?'':' paused')+'" data-act="pause">'+(S.runStart?'一時停止':'再開')+'</button>';
    h+='<button class="next" data-act="next">'+(S.cur<S.blocks.length-1?'次のブロックへ進む':'最後のブロックを完了する')+'</button></div>';
  }
  if(S.cur<0)h+='<p class="hint">ブロックを押すと、設定時間でカウントダウンが始まります。</p>';
  return h;
}
function updateTimer(){
  var rem=document.getElementById('rem');if(!rem)return;
  var rb=document.getElementById('remBox'),db=document.getElementById('delBox'),dv=document.getElementById('del'),ab=document.getElementById('alertbar');
  var c=calc(),red=false,delMs=0;
  if(S.finished){rem.textContent='完了';delMs=S.blocks[S.cur].outD*1000}
  else if(!c){rem.textContent='--:--'}
  else{rem.textContent=mmss(c.rem,true);red=c.rem===0;delMs=c.del}
  var late=delMs>=1000;
  rb.className='panel'+(red?' red':'');
  db.className='panel'+(late?' red':' green');
  dv.textContent=late?mmss(delMs,false):'正常';
  var ld=document.querySelector('.blk.doing .act');if(ld&&S.cur>=0&&!S.finished)ld.textContent='実績 '+mmss(elapsed(),false);
  ab.hidden=!(!S.finished&&c&&c.rem===0&&c.del>=1000);
  ab.querySelector('button').hidden=muted;
}
function sub(title,body){
  return '<div class="ov"><div class="in"><header><button class="ibtn" data-act="back" aria-label="戻る">←</button><h3>'+title+'</h3></header>'+body+'</div></div>';
}
function menuView(){
  return sub('設定','<div class="menu"><button class="row" data-act="v" data-v="blocks">ブロック設定<span>›</span></button><button class="row" data-act="v" data-v="alert">アラート音設定<span>›</span></button></div><button class="danger" data-act="reset">タイマーをリセットする</button>');
}
function defMin(){return S.def||(S.blocks[S.blocks.length-1]||{}).min||10}
function rowHtml(b,i){
  return '<div class="row2"><b style="flex:1">'+(i+1)+'ブロック</b><button class="sm" data-act="dec" data-i="'+i+'">−</button><input type="number" min="1" max="999" value="'+b.min+'" data-f="min" data-i="'+i+'" aria-label="'+(i+1)+'ブロックの時間（分）"><button class="sm" data-act="inc" data-i="'+i+'">＋</button><span>分</span></div>';
}
function blocksView(){
  var h='<p class="opt">ブロック数と時間を入れると、その数のブロックが作られます。ブロックごとの時間は下で個別に変更できます。作業中に時間を変えると、残り時間にも反映されます。</p>';
  h+='<div class="lab"><span>ブロック数</span><span class="stp"><button class="sm" data-act="cdec">−</button><input type="number" min="1" max="50" value="'+S.blocks.length+'" data-s2="count" aria-label="ブロック数"><button class="sm" data-act="cinc">＋</button></span></div>';
  h+='<div class="lab"><span>全ブロックの時間（一括設定）</span><span class="stp"><input type="number" min="1" max="999" value="'+defMin()+'" data-s2="all" aria-label="全ブロックの時間（分）"><span>分</span></span></div>';
  h+='<h2>ブロックごとの時間</h2><div class="grid2">'+S.blocks.map(rowHtml).join('')+'</div>';
  return sub('ブロック設定',h);
}
function setCount(n){
  n=Math.max(1,Math.min(50,Math.round(n)||1));
  var go=function(){keepCur(function(){
    while(S.blocks.length<n)S.blocks.push({id:uid(),name:(S.blocks.length+1)+'ブロック',min:defMin(),st:'idle',inD:0,outD:0,act:null});
    if(S.blocks.length>n)S.blocks.length=n;
  })};
  if(S.cur>=n){ask('作業中のブロックが削除されるため、タイマーがリセットされます。続けますか？',go)}else if(n!==S.blocks.length){go()}else{render()}
}
function setAll(v){
  v=Math.max(1,Math.min(999,Math.round(v)||1));
  S.def=v;S.blocks.forEach(function(b){b.min=v});save();render();
}
function alertView(){
  var s=S.set,h='';
  h+='<label class="lab"><span>アラート音</span><input type="checkbox" data-s="on" '+(s.on?'checked':'')+'></label>';
  h+='<label class="lab"><span>音量</span><input type="range" min="0.1" max="1" step="0.05" value="'+s.vol+'" data-s="vol"></label>';
  h+='<label class="lab"><span>音の種類</span><select data-s="type">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(s.type===k?' selected':'')+'>'+TYPES[k]+'</option>'}).join('')+'</select></label>';
  h+='<label class="lab"><span>繰り返し再生（止めるまで2秒ごと）</span><input type="checkbox" data-s="repeat" '+(s.repeat?'checked':'')+'></label>';
  h+='<button class="next" data-act="test">試し聞き</button>';
  return sub('アラート音設定',h);
}
var lastCur=-2,spinning=false;
function render(){
  var a=document.getElementById('app');
  var oldStrip=a.querySelector('.strip'),oldOv=a.querySelector('.ov'),sx=oldStrip?oldStrip.scrollLeft:0,so=oldOv?oldOv.scrollTop:0,ovKey=oldOv?view:'';
  var ov={menu:menuView,blocks:blocksView,alert:alertView}[view];
  a.innerHTML=mainView()+(ov?ov():'')+(dlg?dlgView():'');
  var strip=a.querySelector('.strip');
  if(strip){
    strip.scrollLeft=sx;
    if(S.cur!==lastCur){
      var el=strip.querySelectorAll('.blk')[S.cur];
      if(el){strip.scrollTo({left:Math.max(0,el.offsetLeft-(strip.clientWidth-el.offsetWidth)/2),behavior:lastCur===-2?'auto':'smooth'})}
      lastCur=S.cur;
    }
  }
  var nov=a.querySelector('.ov');if(nov&&ovKey===view)nov.scrollTop=so;
  updateTimer();
}

/* ---------- 編集 ---------- */
function keepCur(fn){
  var id=S.cur>=0?S.blocks[S.cur].id:null;
  fn();
  if(id){var k=S.blocks.findIndex(function(b){return b.id===id});if(k<0){resetAll()}else S.cur=k}
  save();render();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,i=+t.dataset.i;
  if(a==='menu'){
    if(spinning)return;spinning=true;
    var lg=t.querySelector('.logo'),calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(lg&&!calm)lg.classList.add('spin');
    setTimeout(function(){spinning=false;view='menu';render()},calm?0:500);
  }
  else if(a==='back'){view=(view==='menu')?'main':'menu';render()}
  else if(a==='v'){view=t.dataset.v;render()}
  else if(a==='go'){startBlock(i)}
  else if(a==='pause'){togglePause()}
  else if(a==='next'){S.cur<S.blocks.length-1?startBlock(S.cur+1):finish()}
  else if(a==='mute'){muted=true;updateTimer()}
  else if(a==='reset'){ask('タイマーを最初の状態に戻しますか？',function(){resetAll();view='main';render()})}
  else if(a==='dlgok'){var f=dlg.cb;dlg=null;render();if(f)f()}
  else if(a==='dlgno'){dlg=null;render()}
  else if(a==='cdec'){setCount(S.blocks.length-1)}
  else if(a==='cinc'){setCount(S.blocks.length+1)}
  else if(a==='inc'||a==='dec'){var b=S.blocks[i];b.min=Math.max(1,Math.min(999,b.min+(a==='inc'?1:-1)));save();render()}
  else if(a==='test'){beep()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.s2){if(t.dataset.s2==='count')setCount(+t.value);else setAll(+t.value);return}
  if(t.dataset.f){
    var b=S.blocks[+t.dataset.i];
    if(t.dataset.f==='name')b.name=t.value.trim()||(+t.dataset.i+1)+'ブロック';
    else b.min=Math.max(1,Math.min(999,Math.round(+t.value)||1));
    save();render();
  }else if(t.dataset.s){
    var k=t.dataset.s;
    S.set[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;
    save();if(k==='type')beep();
  }
});

/* ---------- 毎フレーム ---------- */
setInterval(function(){
  if(S.cur>=0&&!S.finished&&S.runStart){
    var c=calc();
    if(c.rem===0){
      if(!S.alerted){S.alerted=true;lastBeep=now();save();if(!muted)beep()}
      else if(S.set.repeat&&!muted&&now()-lastBeep>2000){lastBeep=now();beep()}
    }
  }
  updateTimer();
},250);
render();
</script>
</body>
</html>
